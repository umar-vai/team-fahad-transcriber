[server]
maxUploadSize = 600

[browser]
gatherUsageStats = false

[client]
showSidebarNavigation = false
toolbarMode = "minimal"

[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
codeFont = "monospace"
baseRadius = "10px"
borderColor = "#e3e6ec"
showWidgetBorder = true

[theme.light]
primaryColor = "#4f46e5"
backgroundColor = "#f6f7f9"
secondaryBackgroundColor = "#ffffff"
textColor = "#111827"
borderColor = "#e3e6ec"
linkColor = "#4f46e5"

[theme.light.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f6f7f9"
textColor = "#111827"
borderColor = "#e3e6ec"

[theme.dark]
primaryColor = "#818cf8"
backgroundColor = "#0e1015"
secondaryBackgroundColor = "#171a21"
textColor = "#e7e9ee"
borderColor = "#262a33"
linkColor = "#a5b4fc"

[theme.dark.sidebar]
backgroundColor = "#13151b"
secondaryBackgroundColor = "#1b1e26"
textColor = "#e7e9ee"
borderColor = "#262a33"
