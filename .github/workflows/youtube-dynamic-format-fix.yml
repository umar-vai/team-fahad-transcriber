name: YouTube dynamic format fix

on:
  push:
    branches: [main]
    paths:
      - '.github/youtube-dynamic-format-fix.py'
      - '.github/workflows/youtube-dynamic-format-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply dynamic YouTube format patch
        run: python .github/youtube-dynamic-format-fix.py
      - name: Validate Python
        run: |
          python -m py_compile pages/3_YouTube_Downloader.py
          git diff --check
      - name: Commit patched downloader
        run: |
          if git diff --quiet -- pages/3_YouTube_Downloader.py; then
            echo 'No downloader changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/3_YouTube_Downloader.py
          git commit -m 'Detect available YouTube formats dynamically'
          git push
