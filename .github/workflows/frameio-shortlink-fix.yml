name: Frame.io short-link routing fix

on:
  push:
    paths:
      - '.github/frameio-shortlink-fix.py'
      - '.github/workflows/frameio-shortlink-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Frame.io short-link patch
        run: python .github/frameio-shortlink-fix.py
      - name: Validate Python
        run: |
          python -m py_compile app.py
          git diff --check
      - name: Commit patched app
        run: |
          if git diff --quiet -- app.py; then
            echo 'No app.py changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Fix Frame.io f.io short-link routing'
          git push
