name: Frame.io fast mode

on:
  push:
    paths:
      - '.github/frameio-fastmode.py'
      - '.github/workflows/frameio-fastmode.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Frame.io fast mode patch
        run: python .github/frameio-fastmode.py
      - name: Validate Python
        run: |
          python -m py_compile app.py
          git diff --check
      - name: Commit patched app
        run: |
          if git diff --quiet -- app.py; then
            echo 'No app.py changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Speed up Frame.io public review resolution'
          git push
