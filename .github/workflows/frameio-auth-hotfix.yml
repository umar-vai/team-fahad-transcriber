name: Frame.io OAuth reconnect hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/frameio_auth_hotfix.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply hotfix
        run: python .github/frameio_auth_hotfix.py
      - name: Validate Python
        run: |
          python -m py_compile app.py pages/2_Batch_Transcription.py
          git diff --check
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Fix Frame.io OAuth reconnect handling"
          git push origin main
