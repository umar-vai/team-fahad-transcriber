name: Local downloader validation

on:
  push:
    branches: [main]
    paths:
      - 'local_downloader/**'
      - 'Start_Local_YouTube_Downloader.bat'
      - '.github/workflows/local-downloader-check.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate local downloader Python
        run: |
          python -m py_compile local_downloader/app.py
          git diff --check
