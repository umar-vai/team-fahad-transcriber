name: Refactor single and batch transcription

on:
  push:
    branches: [main]
    paths:
      - '.github/refactor_single_batch.py'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply refactor
        run: python .github/refactor_single_batch.py

      - name: Validate Python
        run: |
          python -m py_compile app.py pages/2_Batch_Transcription.py
          git diff --check

      - name: Commit refactor
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py pages/2_Batch_Transcription.py
          git commit -m "Separate single-link and batch URL workflows"
          git push origin main
