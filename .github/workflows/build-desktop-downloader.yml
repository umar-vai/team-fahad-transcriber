name: Build Desktop Downloader

on:
  push:
    branches: [main]
    paths:
      - 'desktop_downloader/**'
      - '.github/workflows/build-desktop-downloader.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop_downloader/requirements.txt

      - name: Validate Python
        shell: pwsh
        run: |
          python -m py_compile desktop_downloader/app.py

      - name: Build portable EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name TeamFahadYouTubeDownloader `
            --collect-all yt_dlp `
            --collect-all imageio_ffmpeg `
            --collect-all customtkinter `
            --collect-all PIL `
            desktop_downloader/app.py

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: TeamFahadYouTubeDownloader-Windows
          path: dist/TeamFahadYouTubeDownloader.exe
          if-no-files-found: error
          retention-days: 30
