name: Build the Windows bridge

on:
  push:
    branches: [main]
    paths:
      - "bridge/**"
      - ".github/workflows/bridge-windows.yml"
    tags: ["bridge-v*"]
  pull_request:
    paths:
      - "bridge/**"
  workflow_dispatch:

permissions:
  contents: write

# A new push replaces the run for the same branch.
concurrency:
  group: bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm test

  package:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stage the program (Node, ffmpeg, source)
        shell: pwsh
        run: |
          $stage = "dist/stage"
          New-Item -ItemType Directory -Force -Path "$stage/ffmpeg" | Out-Null
          Copy-Item bridge/package.json $stage
          Copy-Item bridge/src "$stage/src" -Recurse
          Copy-Item (Get-Command node).Source "$stage/node.exe"
          # ffmpeg (GPL build by BtbN, includes the MP3 encoder). Only ffmpeg.exe is needed.
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-unpacked
          Copy-Item (Get-ChildItem ffmpeg-unpacked -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName "$stage/ffmpeg/ffmpeg.exe"
          Copy-Item (Get-ChildItem ffmpeg-unpacked -Recurse -Filter LICENSE.txt | Select-Object -First 1).FullName "$stage/ffmpeg/LICENSE.txt"
          & "$stage/ffmpeg/ffmpeg.exe" -version | Select-Object -First 1
          & "$stage/node.exe" --version
      - name: Check audio decoding and MP3 encoding with the staged ffmpeg
        shell: pwsh
        run: |
          $env:BRIDGE_DATA_DIR = "$PWD/smoke-data"
          $env:FFMPEG_PATH = "$PWD/dist/stage/ffmpeg/ffmpeg.exe"
          & $env:FFMPEG_PATH -v error -f lavfi -i "sine=frequency=440:duration=5" -y smoke.wav
          cd dist/stage
          & ./node.exe --input-type=module -e "import('./src/audio.js').then(async (a) => { const d = await a.decodeToRaw('../../smoke.wav'); const p = a.planPieces(d.raw, d.samples); const e = await a.encodePiece(d.raw, p[0]); if (e.mimeType !== 'audio/mpeg' || e.data.length < 1000) { throw new Error('mp3 encode failed: ' + e.mimeType); } console.log('ok', p.length, e.mimeType, e.data.length); })"
      - name: Build TeamFahadBridge-Setup.exe
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = (Get-Content bridge/package.json | ConvertFrom-Json).version
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DStage=$PWD\dist\stage" bridge/windows/TeamFahadBridge.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-Item dist/TeamFahadBridge-Setup.exe | Select-Object Name, @{n="MB";e={[math]::Round($_.Length/1MB,1)}}
      - name: Install it silently, check the app answers, uninstall it
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "TeamFahadBridge"
          $env:BRIDGE_DATA_DIR = ""
          # Wait for the installer process only. "Start-Process -Wait" would also wait for the bridge it starts, which never ends.
          $setup = Start-Process dist/TeamFahadBridge-Setup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$dir" -PassThru
          if (-not $setup.WaitForExit(300000)) { throw "The installer did not finish within 5 minutes." }
          if ($setup.ExitCode -ne 0) { throw "The installer failed with exit code $($setup.ExitCode)." }
          foreach ($f in "node.exe", "src\index.js", "ffmpeg\ffmpeg.exe", "open-window.vbs", "start-bridge.vbs", "unins000.exe") {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "Not installed: $f" }
          }
          $status = $null
          for ($i = 0; $i -lt 30 -and -not $status; $i++) {
            try { $status = Invoke-RestMethod http://127.0.0.1:47821/api/status } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $status) { throw "The bridge did not start after installing." }
          $status | ConvertTo-Json -Compress
          $page = Invoke-WebRequest http://127.0.0.1:47821/ -UseBasicParsing
          if ($page.StatusCode -ne 200 -or $page.Content -notmatch "Team Fahad Bridge") { throw "Setup page did not load." }
          $remove = Start-Process (Join-Path $dir "unins000.exe") -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -PassThru
          if (-not $remove.WaitForExit(120000)) { throw "The uninstaller did not finish within 2 minutes." }
          Start-Sleep -Seconds 4
          if (Test-Path (Join-Path $dir "node.exe")) { throw "Uninstall left node.exe behind." }
          Write-Host "Install and uninstall work."
      - uses: actions/upload-artifact@v4
        with:
          name: TeamFahadBridge-Setup
          path: dist/TeamFahadBridge-Setup.exe
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/bridge-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" dist/TeamFahadBridge-Setup.exe --title "Team Fahad Bridge ${{ github.ref_name }}" --notes "Windows installer. Double-click TeamFahadBridge-Setup.exe."
      - name: Publish the latest build as a release (easy download, no login needed)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # latest.json lets installed apps see that a newer version exists and verify the download.
          $version = (Get-Content bridge/package.json | ConvertFrom-Json).version
          $exe = Get-Item dist/TeamFahadBridge-Setup.exe
          $sha = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          @{ version = $version; size = $exe.Length; sha256 = $sha } | ConvertTo-Json -Compress | Set-Content -Encoding ascii dist/latest.json
          Get-Content dist/latest.json
          gh release delete bridge-latest --cleanup-tag --yes 2>$null
          gh release create bridge-latest dist/TeamFahadBridge-Setup.exe dist/latest.json --target "${{ github.sha }}" --title "Team Fahad Bridge (latest)" --notes "Newest Windows installer. Download TeamFahadBridge-Setup.exe and double-click it."
