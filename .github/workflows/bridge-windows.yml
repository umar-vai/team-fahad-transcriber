name: Build the Windows bridge

on:
  push:
    branches: [main]
    paths:
      - "bridge/**"
      - ".github/workflows/bridge-windows.yml"
    tags: ["bridge-v*"]
  pull_request:
    paths:
      - "bridge/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm test

  package:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assemble the zip
        shell: pwsh
        run: |
          $dist = "dist/TeamFahadBridge"
          New-Item -ItemType Directory -Force -Path "$dist/ffmpeg" | Out-Null
          Copy-Item bridge/package.json, bridge/windows/install.bat, bridge/windows/uninstall.bat, bridge/windows/install.ps1, bridge/README.md $dist
          Copy-Item bridge/src "$dist/src" -Recurse
          Copy-Item (Get-Command node).Source "$dist/node.exe"
          # ffmpeg (GPL build by BtbN, includes the MP3 encoder). Only ffmpeg.exe is needed.
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-unpacked
          Copy-Item (Get-ChildItem ffmpeg-unpacked -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName "$dist/ffmpeg/ffmpeg.exe"
          Copy-Item (Get-ChildItem ffmpeg-unpacked -Recurse -Filter LICENSE.txt | Select-Object -First 1).FullName "$dist/ffmpeg/LICENSE.txt"
          & "$dist/ffmpeg/ffmpeg.exe" -version | Select-Object -First 1
          & "$dist/node.exe" --version
          Compress-Archive -Path $dist -DestinationPath TeamFahadBridge-windows.zip
      - name: Smoke test on Windows (decode a generated tone and encode it to MP3)
        shell: pwsh
        run: |
          $env:BRIDGE_DATA_DIR = "$PWD/smoke-data"
          $env:FFMPEG_PATH = "$PWD/dist/TeamFahadBridge/ffmpeg/ffmpeg.exe"
          & $env:FFMPEG_PATH -v error -f lavfi -i "sine=frequency=440:duration=5" -y smoke.wav
          cd dist/TeamFahadBridge
          & ./node.exe --input-type=module -e "import('./src/audio.js').then(async (a) => { const d = await a.decodeToRaw('../../smoke.wav'); const p = a.planPieces(d.raw, d.samples); const e = await a.encodePiece(d.raw, p[0]); if (e.mimeType !== 'audio/mpeg' || e.data.length < 1000) { throw new Error('mp3 encode failed: ' + e.mimeType); } console.log('ok', p.length, e.mimeType, e.data.length); })"
      - uses: actions/upload-artifact@v4
        with:
          name: TeamFahadBridge-windows
          path: TeamFahadBridge-windows.zip
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/bridge-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" TeamFahadBridge-windows.zip --title "Team Fahad Bridge ${{ github.ref_name }}" --notes "Windows bridge. Unzip, double-click install.bat."
